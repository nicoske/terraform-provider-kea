name: Test

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - README.md
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go:
          - oldstable
          - stable

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run GoReleaser in build mode to test all release platforms
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          version: v2.18.2
          args: build --snapshot

  kea-matrix:
    runs-on: ubuntu-24.04
    outputs:
      kea: ${{ steps.matrix.outputs.kea }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - id: matrix
        run: echo "kea=$(jq -c . testing/kea-matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    name: test (Go ${{ matrix.go }}, Kea ${{ matrix.kea.version }})
    needs: kea-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go:
          - oldstable
          - stable
        kea: ${{ fromJSON(needs.kea-matrix.outputs.kea) }}
    continue-on-error: ${{ !matrix.kea.stable }}

    env:
      KEA_DHCP4_ADDRESS: http://localhost:8000
      KEA_VERSION: ${{ matrix.kea.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_wrapper: false
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e  # v1.3.0

      - name: Setup Kea server
        run: docker compose --file testing/docker-compose.yml up --wait
        timeout-minutes: 30

      - run: make testacc

      - name: Show Kea server logs
        if: failure()
        run: docker compose --file testing/docker-compose.yml logs --no-color --tail 500

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: stable
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_wrapper: false

      - run: make fmtcheck

      - name: Verify generated files are up-to-date
        run: |
          make generate
          git diff --exit-code || (echo "Generated files are out of date. Run 'make generate' and commit the changes." && exit 1)

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
